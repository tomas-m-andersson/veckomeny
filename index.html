<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veckomeny</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e8f2fb">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef3f1;--card:#fff;--ink:#1b2a2e;--mut:#5b6c70;--line:#d3ddda;--acc:#1f5fbf;--accink:#fff;--helg:#f4c94a;--helgink:#3b2d00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a1c;--card:#1b272a;--ink:#e8f0ee;--mut:#97a9ad;--line:#2d3e42;--acc:#6aa3ff;--accink:#08162e;--helg:#d9b13a;--helgink:#241b00}}
:root[data-theme="dark"]{--bg:#121a1c;--card:#1b272a;--ink:#e8f0ee;--mut:#97a9ad;--line:#2d3e42;--acc:#6aa3ff;--accink:#08162e;--helg:#d9b13a;--helgink:#241b00}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:clamp(2.4rem,9vw,3.6rem);line-height:1;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0 0 22px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px}
button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.main{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600;padding:12px 20px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:grid;grid-template-columns:32px 92px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:12px;padding:12px 14px}
li.helg{border-left-color:var(--helg)}
.dag{font-weight:800}
.dag small{display:block;font-weight:400;color:var(--mut);font-size:.78rem}
.ratt{font-size:1.05rem}
li button{padding:6px 10px;font-size:.9rem}
details{margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;font-weight:600}
label{display:block;margin:14px 0 4px;font-weight:600}
textarea{width:100%;min-height:150px;resize:none;overflow:hidden;display:block;font:inherit;font-size:.95rem;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
.hint{color:var(--mut);font-size:.88rem;margin:0 0 4px}
#msg{min-height:1.4em;color:var(--mut);margin:10px 0 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.icons{display:flex;gap:8px;flex:none}
.sub[hidden]{display:none}
#theme,#info{width:44px;height:44px;padding:0;border-radius:50%;display:grid;place-items:center;flex:none}
#info[aria-expanded="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#theme svg,#info svg{width:22px;height:22px}
.acts{display:flex;gap:6px}
button.edit,button.ico{width:36px;height:36px;display:grid;place-items:center}
li .acts button.ico,li .acts button.edit{padding:0}
.ico svg,.edit svg{width:18px;height:18px;display:block}
.ratt-in{font:inherit;width:100%;min-width:0;padding:8px 10px;border:2px solid var(--acc);border-radius:8px;background:var(--bg);color:var(--ink)}
button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
#incoming{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:2px solid var(--acc);border-radius:12px;padding:12px 14px;margin-bottom:18px}
#incoming[hidden]{display:none}
#incoming p{flex:1 1 100%;margin:0}
.grip{width:32px;height:40px;padding:0;border:0;background:none;color:var(--mut);cursor:grab;touch-action:none;display:grid;place-items:center}
.grip:disabled{opacity:.3;cursor:default}
li.dragging{position:relative;z-index:5;box-shadow:0 10px 26px rgba(0,0,0,.28);transition:none;cursor:grabbing}
li.target{outline:3px dashed var(--acc);outline-offset:-3px}
li.nodrop{outline:3px dashed var(--mut);outline-offset:-3px;opacity:.6}
@media (max-width:460px){li{grid-template-columns:32px 1fr auto}.grip{grid-row:1;grid-column:1}.dag{grid-row:1;grid-column:2/-1}.ratt,.ratt-in{grid-row:2;grid-column:1/3}.acts{grid-row:2;grid-column:3;gap:4px}li .acts button{padding:6px 8px}}
@media (prefers-reduced-motion:no-preference){li{transition:transform .15s}li.pop{transform:scale(1.015)}}

/* ===== Design ===== */
:root{--bg:#e8f2fb;--card:#ffffff;--ink:#1a2433;--mut:#5a6b80;--line:#cfdcea;--acc:#2563d6;--accink:#ffffff;--helg:#ffd84d;--helgink:#3a2c00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a28;--card:#1a2638;--ink:#eaf1fb;--mut:#9fb1c8;--line:#2b3b52;--acc:#7aa8ff;--accink:#0a1a38;--helg:#e0b92f;--helgink:#241b00}}
:root[data-theme="dark"]{--bg:#101a28;--card:#1a2638;--ink:#eaf1fb;--mut:#9fb1c8;--line:#2b3b52;--acc:#7aa8ff;--accink:#0a1a38;--helg:#e0b92f;--helgink:#241b00}
body{font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif}
h1{color:var(--acc);font-weight:800}
.sub{font-size:1rem}
button{border-radius:999px;border-width:2px}
.main{padding:12px 22px;font-size:1.02rem}
li{border:0;border-radius:20px;box-shadow:inset 8px 0 0 var(--dc),0 2px 0 var(--line);padding:14px 16px 14px 20px}
li:nth-child(1){--dc:#e5484d}li:nth-child(2){--dc:#f08a24}li:nth-child(3){--dc:#e2b007}li:nth-child(4){--dc:#2f9e5b}li:nth-child(5){--dc:#1f8fd1}li:nth-child(6){--dc:#6e56cf}li:nth-child(7){--dc:#d6409f}
.ratt{font-size:1.1rem;font-weight:600}
.dag small{display:block;width:fit-content;background:var(--helg);color:var(--helgink);border-radius:99px;padding:0 9px;font-size:.72rem;font-weight:700;margin-top:3px}

</style>
</head>
<body>
<main>
<header class="top"><h1>Veckomeny</h1><div class="icons"><button id="info" type="button" aria-expanded="false" aria-controls="infotext"></button><button id="theme" type="button"></button></div></header>
<p class="sub" id="infotext" hidden>Måndag till torsdag väljs ur vardagsrätter. Fredag till söndag väljs ur helgrätter. Dra i prickarna till vänster för att byta plats på två dagar. Med pennan skriver du en egen rätt för just den dagen.</p>
<div id="incoming" hidden></div>
<div class="bar">
<button class="main" id="gen">Slumpa ny vecka</button>
<button id="lockall"></button>
<button id="share">Dela veckan</button>
<button id="copy">Kopiera menyn</button>
</div>
<ul id="week"></ul>
<p id="msg" role="status"></p>
<details>
<summary>Redigera rätter</summary>
<label for="vardag">Vardagsrätter</label>
<p class="hint">En rätt per rad. Sparas automatiskt i den här webbläsaren.</p>
<textarea id="vardag"></textarea>
<label for="helg">Helg- och fredagsrätter</label>
<textarea id="helg"></textarea>
<p><button id="sharelist">Dela rättslistan</button> <button id="reset">Återställ min ursprungliga lista</button></p>
</details>
</main>
<script>
const DAGAR=["Måndag","Tisdag","Onsdag","Torsdag","Fredag","Lördag","Söndag"];
const GRIP='<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.8"/><circle cx="15" cy="6" r="1.8"/><circle cx="9" cy="12" r="1.8"/><circle cx="15" cy="12" r="1.8"/><circle cx="9" cy="18" r="1.8"/><circle cx="15" cy="18" r="1.8"/></svg>';
const DEF={
vardag:["Blodpudding med bacon och stekt ägg","Potatisbullar med bacon","Falukorv med makaroner/stuvade makaroner","Köttfärssås med spaghetti","Fiskpinnar med potatis/potatismos","Köttbullar med potatismos och gräddsås","Pasta med skinksås","Tjockpannkaka med bacon","Lax med potatis","Korvstroganoff med pasta eller ris","Kyckling med currysås och ris","Korv med bröd","Chicken nuggets med pommes eller ris"],
helg:["Köttfärslimpa med potatis och sås","Pannbiff med potatis och stekt lök","Tacos","Hemgjord pizza","Pannkakor","Våfflor","Plättar"]};
function load(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let lists=load("lists")||JSON.parse(JSON.stringify(DEF));
let editing=null;
const IC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
const LOCK=IC+'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const UNLOCK=IC+'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>';
const REFRESH=IC+'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>';
const PEN='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
let week=load("week");
let locks=load("locks");
if(!Array.isArray(locks)||locks.length!==7)locks=Array(7).fill(false);
const $=id=>document.getElementById(id);
const kind=i=>i>=4?"helg":"vardag";
function pick(i,used){
  const all=lists[kind(i)];
  const pool=all.filter(x=>!used.includes(x));
  const src=pool.length?pool:all;
  return src.length?src[Math.floor(Math.random()*src.length)]:"Lägg till rätter under Redigera rätter";
}
function gen(){
  if(week&&week.length===7&&locks.every(Boolean)){$("msg").textContent="Alla dagar är låsta. Lås upp några dagar för att slumpa om.";return}
  $("msg").textContent="";
  const old=week&&week.length===7?week:[];
  const next=DAGAR.map((_,i)=>locks[i]&&old[i]?old[i]:null);
  const used=next.filter(Boolean);
  week=next.map((d,i)=>{if(d)return d;const n=pick(i,used);used.push(n);return n});
  save("week",week);render();
}
function swap(i){
  if(locks[i])return;
  const used=week.filter((_,j)=>j!==i&&kind(j)===kind(i));
  week[i]=pick(i,used);save("week",week);render(i);
}
function render(hit){
  const ul=$("week");ul.textContent="";
  if(!week||week.length!==7){gen();return}
  week.forEach((d,i)=>{
    const li=document.createElement("li");
    if(kind(i)==="helg")li.className="helg";
    const dag=document.createElement("div");dag.className="dag";
    dag.textContent=DAGAR[i];
    if(kind(i)==="helg"){const s=document.createElement("small");s.textContent="helgrätt";dag.appendChild(s)}
    let r;
    if(editing===i){
      r=document.createElement("input");r.type="text";r.maxLength=120;r.value=d;r.className="ratt-in";
      r.setAttribute("aria-label","Egen rätt för "+DAGAR[i]);
      r.setAttribute("enterkeyhint","done");
      r.onkeydown=ev=>{
        if(ev.key==="Enter"){ev.preventDefault();commitEdit(i,r.value)}
        else if(ev.key==="Escape"){editing=null;render()}
      };
      r.onblur=()=>commitEdit(i,r.value);
      setTimeout(()=>{r.focus();r.select()},0);
    }else{r=document.createElement("div");r.className="ratt";r.textContent=d}
    const b=document.createElement("button");b.className="ico";b.innerHTML=REFRESH;b.title="Byt rätt";
    b.setAttribute("aria-label","Byt rätt för "+DAGAR[i]);
    b.onclick=()=>swap(i);
    const lk=document.createElement("button");
    lk.className="ico";lk.innerHTML=locks[i]?LOCK:UNLOCK;lk.title=locks[i]?"Lås upp":"Lås";
    lk.setAttribute("aria-pressed",locks[i]?"true":"false");
    lk.setAttribute("aria-label",(locks[i]?"Lås upp ":"Lås ")+DAGAR[i]);
    lk.onclick=()=>{locks[i]=!locks[i];save("locks",locks);render()};
    b.disabled=!!locks[i];
    const acts=document.createElement("div");acts.className="acts";const ed=document.createElement("button");ed.type="button";ed.className="edit";ed.innerHTML=PEN;
    ed.setAttribute("aria-label","Skriv egen rätt för "+DAGAR[i]);
    ed.onclick=()=>{editing=i;render()};
    acts.append(lk,b,ed);
    const gr=document.createElement("button");
    gr.type="button";gr.className="grip";gr.innerHTML=GRIP;gr.disabled=!!locks[i];
    gr.setAttribute("aria-label","Flytta "+DAGAR[i]+": dra, eller tryck pil upp eller ner");
    li.dataset.i=i;
    li.append(gr,dag,r,acts);ul.appendChild(li);
    if(hit===i){li.classList.add("pop");setTimeout(()=>li.classList.remove("pop"),160)}
  });
  const all=locks.every(Boolean),la=$("lockall");
  la.textContent=all?"Lås upp hela veckan":"Lås hela veckan";
  la.setAttribute("aria-pressed",all?"true":"false");
}
$("gen").onclick=gen;
$("lockall").onclick=()=>{
  const all=locks.every(Boolean);
  locks=Array(7).fill(!all);save("locks",locks);render();
};
$("copy").onclick=async()=>{
  const t=DAGAR.map((d,i)=>d+": "+week[i]).join("\n");
  try{await navigator.clipboard.writeText(t);$("msg").textContent="Menyn är kopierad."}
  catch(e){$("msg").textContent="Kunde inte kopiera. Markera texten och kopiera själv."}
};
["vardag","helg"].forEach(k=>{
  $(k).value=lists[k].join("\n");
  $(k).addEventListener("input",()=>{
    lists[k]=$(k).value.split("\n").map(s=>s.trim()).filter(Boolean);
    save("lists",lists);
  });
});
$("reset").onclick=()=>{
  lists=JSON.parse(JSON.stringify(DEF));save("lists",lists);
  ["vardag","helg"].forEach(k=>$(k).value=lists[k].join("\n"));
  fitAll();$("msg").textContent="Listan är återställd.";
};
render();

const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const dec=t=>{t=t.replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";return decodeURIComponent(escape(atob(t)))};
async function share(payload,title){
  const url=location.origin+location.pathname+"#d="+enc(payload);
  try{
    if(navigator.share){await navigator.share({title:title,url:url});return}
    await navigator.clipboard.writeText(url);
    $("msg").textContent="Länken är kopierad. Skicka den till din fru.";
  }catch(e){
    if(e&&e.name==="AbortError")return;
    prompt("Kopiera länken och skicka den:",url);
  }
}
$("share").onclick=()=>share({w:week,k:locks},"Veckomeny");
$("sharelist").onclick=()=>share({v:lists},"Rättslista");

function clean(o){
  const s=x=>typeof x==="string"?x.trim().slice(0,120):"";
  const out={};
  if(Array.isArray(o.w)&&o.w.length===7&&o.w.every(x=>typeof x==="string")){
    out.w=o.w.map(s);
    out.k=Array.isArray(o.k)&&o.k.length===7?o.k.map(Boolean):Array(7).fill(false);
  }
  if(o.v&&Array.isArray(o.v.vardag)&&Array.isArray(o.v.helg)){
    out.v={vardag:o.v.vardag.map(s).filter(Boolean).slice(0,100),helg:o.v.helg.map(s).filter(Boolean).slice(0,100)};
  }
  return out.w||out.v?out:null;
}
let incoming=null;
try{const m=location.hash.match(/^#d=(.+)$/);if(m)incoming=clean(JSON.parse(dec(m[1])))}catch(e){}
function apply(w,v){
  if(w&&incoming.w){week=incoming.w;locks=incoming.k;save("week",week);save("locks",locks);render()}
  if(v&&incoming.v){lists=incoming.v;save("lists",lists);["vardag","helg"].forEach(k=>$(k).value=lists[k].join("\n"));fitAll()}
  incoming=null;$("incoming").hidden=true;
  try{history.replaceState(null,"",location.pathname)}catch(e){}
}
if(incoming){
  const box=$("incoming");
  const p=document.createElement("p");
  p.textContent=incoming.w?"Någon har delat en veckomeny med dig. Din egen meny ersätts om du använder den.":"Någon har delat en rättslista med dig. Din egen lista ersätts om du använder den.";
  box.appendChild(p);
  const mk=(t,f)=>{const b=document.createElement("button");b.textContent=t;b.onclick=f;box.appendChild(b)};
  if(incoming.w)mk("Använd veckan",()=>apply(true,false));
  if(incoming.v)mk("Använd rättslistan",()=>apply(false,true));
  mk("Stäng",()=>apply(false,false));
  box.hidden=false;
}
function commitEdit(i,v){
  if(editing!==i)return;
  editing=null;
  v=v.trim().slice(0,120);
  if(v){
    week[i]=v;locks[i]=true;
    save("week",week);save("locks",locks);
    $("msg").textContent=DAGAR[i]+" har din egen rätt och är låst så att den inte slumpas bort.";
  }
  render();
}
function swapDays(a,b){
  if(locks[a]||locks[b]){$("msg").textContent=DAGAR[locks[a]?a:b]+" är låst. Lås upp dagen först.";return false}
  [week[a],week[b]]=[week[b],week[a]];
  save("week",week);
  $("msg").textContent=DAGAR[a]+" och "+DAGAR[b]+" bytte plats.";
  render();return true;
}
let drag=null;
const ulEl=$("week");
ulEl.addEventListener("pointerdown",e=>{
  const g=e.target.closest(".grip");
  if(!g||g.disabled||e.button>0)return;
  const li=g.closest("li");
  drag={i:+li.dataset.i,li:li,y0:e.clientY,to:null,blocked:null};
  try{g.setPointerCapture(e.pointerId)}catch(_){}
  li.classList.add("dragging");
  e.preventDefault();
});
addEventListener("pointermove",e=>{
  if(!drag)return;
  drag.li.style.transform="translateY("+(e.clientY-drag.y0)+"px)";
  const hit=document.elementsFromPoint(e.clientX,e.clientY).map(n=>n.closest?n.closest("#week li"):null).find(n=>n&&n!==drag.li);
  ulEl.querySelectorAll("li").forEach(l=>l.classList.remove("target","nodrop"));
  drag.to=null;drag.blocked=null;
  if(hit){
    const j=+hit.dataset.i;
    if(locks[j]){hit.classList.add("nodrop");drag.blocked=j}
    else{hit.classList.add("target");drag.to=j}
  }
});
function endDrag(e){
  if(!drag)return;
  const d=drag;drag=null;
  ulEl.querySelectorAll("li").forEach(l=>l.classList.remove("target","nodrop"));
  d.li.classList.remove("dragging");d.li.style.transform="";
  if(e.type!=="pointerup")return;
  if(d.to!==null&&d.to!==d.i){swapDays(d.i,d.to);return}
  if(d.blocked!==null)$("msg").textContent=DAGAR[d.blocked]+" är låst. Lås upp dagen först.";
}
addEventListener("pointerup",endDrag);
addEventListener("pointercancel",endDrag);
ulEl.addEventListener("keydown",e=>{
  const g=e.target.closest(".grip");
  if(!g||(e.key!=="ArrowUp"&&e.key!=="ArrowDown"))return;
  e.preventDefault();
  const i=+g.closest("li").dataset.i,j=i+(e.key==="ArrowUp"?-1:1);
  if(j<0||j>6)return;
  if(swapDays(i,j)){const n=ulEl.children[j].querySelector(".grip");if(n)n.focus()}
});

function fit(t){t.style.height="auto";t.style.height=(t.scrollHeight+2)+"px"}
function fitAll(){["vardag","helg"].forEach(k=>fit($(k)))}
["vardag","helg"].forEach(k=>$(k).addEventListener("input",()=>fit($(k))));
document.querySelector("details").addEventListener("toggle",fitAll);
addEventListener("resize",fitAll);
fitAll();

const mq=matchMedia("(prefers-color-scheme: dark)");
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==="dark":mq.matches};
const SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
const SUN=SVG+'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON=SVG+'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function paintTheme(){
  const d=isDark();
  $("theme").innerHTML=d?SUN:MOON;
  $("theme").setAttribute("aria-label",d?"Byt till ljust läge":"Byt till mörkt läge");
  const m=document.querySelector('meta[name="theme-color"]');
  if(m)m.content=d?"#101a28":"#e8f2fb";
}
$("theme").onclick=()=>{
  const n=isDark()?"light":"dark";
  document.documentElement.dataset.theme=n;
  try{localStorage.setItem("theme",n)}catch(e){}
  paintTheme();
};
